name: CI
on:
  push:
  pull_request:
env:
  PYTHONPATH: .
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install practice dependencies
        run: python -m pip install -r requirements-practice.txt
      - name: Test
        run: pytest -q
      - name: Run benchmark
        run: python scripts/run_benchmark.py
      - name: Validate repository
        run: python scripts/validate_submission.py
